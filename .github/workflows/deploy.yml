name: deploy live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  huggingface:
    name: Publish to Hugging Face Spaces
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning title=Live demo not deployed::Add a Hugging Face token as the repository secret HF_TOKEN to publish the online demo."
            exit 0
          fi
          pip install --quiet huggingface_hub
          python .github/scripts/deploy_space.py

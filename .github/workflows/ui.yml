name: ui

# Quick visual check of the web demo (about 10 minutes): starts the real app and saves
# screenshots in the light and night themes as an artifact.
on:
  push:
    paths:
      - "app.py"
      - "ui/**"
      - ".streamlit/**"
      - ".github/scripts/screenshot.py"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

jobs:
  screenshots:
    name: Web demo screenshots (light + night)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup (deps, Ollama, models, index)
        run: bash scripts/setup.sh

      # The BOE server sometimes times out from Codespaces; keep the PDF in the repository so the
      # demo never depends on it. Committed once, the first time CI downloads it.
      - name: Commit the Workers' Statute PDF if it isn't in the repository yet
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git ls-files --error-unmatch data/estatuto_trabajadores.pdf > /dev/null 2>&1; then exit 0; fi
          head -c 4 data/estatuto_trabajadores.pdf | grep -q "%PDF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estatuto_trabajadores.pdf
          git commit -qm "Add the Workers' Statute PDF (BOE consolidated text) to the repository"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open the demo, ask, switch to night theme
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium > /dev/null
          nohup bash scripts/run_app.sh > streamlit.log 2>&1 &
          if ! python .github/scripts/screenshot.py > smoke.log 2>&1; then
            cat smoke.log streamlit.log
            exit 1
          fi
          cat smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            demo.png
            demo-dark.png

      # Latest screenshots on a side branch, so they can be looked at without downloading artifacts.
      - name: Publish screenshots to the ui-screenshots branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/shots && cp demo.png demo-dark.png /tmp/shots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ui-screenshots
          git rm -rq --cached .
          cp /tmp/shots/*.png .
          git add demo.png demo-dark.png
          git commit -qm "UI screenshots for ${GITHUB_SHA::7}"
          git push -f origin HEAD:ui-screenshots

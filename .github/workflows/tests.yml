name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Pipeline tests (no LLM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - run: pytest -m "not llm" -v
      - name: Report installed versions
        run: echo "::notice title=versions::$(pip freeze | grep -iE '^(langchain|chromadb|pypdf|streamlit|pytest)' | paste -sd ' ')"

  codespaces:
    name: One-click demo in the real Codespaces container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install -g @devcontainers/cli

      # The same steps GitHub Codespaces does for a visitor, split so a failure
      # or hang shows which phase it was in.
      - name: Build and start the dev container
        timeout-minutes: 10
        run: devcontainer up --workspace-folder . --skip-post-create

      - name: postCreateCommand (scripts/setup.sh)
        timeout-minutes: 15
        run: |
          set -o pipefail
          if ! timeout 840 devcontainer exec --workspace-folder . bash -c "bash scripts/setup.sh 2>&1 | tee /tmp/setup.log"; then
            echo "::error title=setup failed::$(devcontainer exec --workspace-folder . tail -c 2000 /tmp/setup.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "::notice title=setup finished::$(devcontainer exec --workspace-folder . bash -c 'tail -5 /tmp/setup.log; pgrep -fa "ollama|python" || echo no-leftover-processes' | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: postAttachCommand (scripts/run_app.sh) and ask a question
        timeout-minutes: 12
        run: timeout 660 devcontainer exec --workspace-folder . bash .github/scripts/codespaces_smoke.sh

  docker:
    name: Docker image (whole demo in one container)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: |
          if ! docker build --progress=plain -t rag-demo . > build.log 2>&1; then
            cat build.log
            echo "::error title=docker build failed::$(grep -v '^#[0-9]* sha256' build.log | tail -c 2500 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Run it and ask a question
        run: |
          docker run -d --name demo -p 7860:7860 rag-demo
          for _ in $(seq 1 120); do curl -sf http://localhost:7860/_stcore/health && break; sleep 2; done
          if ! curl -sf http://localhost:7860/_stcore/health; then
            echo "::error title=online demo did not start::$(docker logs demo 2>&1 | tail -c 1500 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          answer=$(docker exec demo python query_data.py "¿Cuántos días de vacaciones al año me corresponden?")
          echo "$answer"
          echo "$answer" | grep -qiE "\b30\b|treinta"
          echo "::notice title=online demo OK::$(echo "$answer" | tr '\n' ' ') | image $(docker image inspect rag-demo --format '{{.Size}}' | numfmt --to=iec)"

  end-to-end:
    name: End-to-end RAG evaluation (Ollama + LLM-as-judge)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Same script GitHub Codespaces runs, so this also proves the one-click demo setup works.
      - name: Setup (deps, Ollama, models, index)
        run: bash scripts/setup.sh

      # setup.sh stops the Ollama server it started (Codespaces starts it again later), so start it here.
      - name: Start Ollama
        run: bash scripts/start_ollama.sh

      - name: Ask a question from the command line
        run: |
          out=$(python query_data.py "¿Cuántos días de vacaciones al año me corresponden?")
          echo "$out"
          echo "::notice title=CLI answer::$(echo "$out" | tr '\n' ' ')"

      - name: Evaluation (35 questions, hybrid vs vector retrieval)
        run: |
          python -m eval.run_eval --out eval-results.md
          cat eval-results.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: eval-results.md

      - name: Web demo smoke test + screenshot
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium > /dev/null
          nohup bash scripts/run_app.sh > streamlit.log 2>&1 &
          if ! python .github/scripts/screenshot.py > smoke.log 2>&1; then
            cat smoke.log streamlit.log
            echo "::error title=smoke test::$(tail -c 1500 smoke.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=streamlit log::$(tail -c 1500 streamlit.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          cat smoke.log
          echo "::notice title=web demo::$(tail -c 800 smoke.log | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: demo-screenshot
          path: |
            demo.png
            demo-dark.png

      # The first time they are missing, save the demo screenshot and the evaluation
      # results into the repository so the README can show them. Delete them to refresh.
      - name: Commit README screenshot and evaluation results
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          changed=0
          if [ ! -f docs/demo.png ]; then mkdir -p docs && cp demo.png docs/demo.png && git add docs/demo.png && changed=1; fi
          if [ ! -f docs/demo-dark.png ]; then mkdir -p docs && cp demo-dark.png docs/demo-dark.png && git add docs/demo-dark.png && changed=1; fi
          if [ ! -f eval/results.md ]; then cp eval-results.md eval/results.md && git add eval/results.md && changed=1; fi
          if [ "$changed" = 0 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add demo screenshot and evaluation results"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"

      # Last, so a flaky answer from the small model doesn't stop the screenshot and results above.
      - name: End-to-end tests (LLM-as-a-judge)
        run: |
          pkill -f "streamlit run" || true   # the demo from the screenshot step shares the index and Ollama
          sleep 2
          bash scripts/start_ollama.sh
          pytest -m llm -v -s

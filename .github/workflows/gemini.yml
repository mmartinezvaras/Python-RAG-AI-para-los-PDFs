name: gemini

# The online setup (the configuration used by the live demo on Streamlit Cloud):
# Gemini for embeddings and answers. Calibrates the relevance gate for Gemini's embeddings,
# runs the 35-question evaluation, records the demo GIF for the README and publishes both.
# Needs the GEMINI_API_KEY repository secret (Settings → Secrets and variables → Actions).
# Run by hand (Actions → gemini → Run workflow): it spends free-tier quota, so not on every push.
on:
  workflow_dispatch:

concurrency:
  group: gemini
  cancel-in-progress: true

jobs:
  online:
    name: Gemini setup (evaluation + demo GIF)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RAG_LLM_PROVIDER: openai
      RAG_EMBEDDINGS: openai
      OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAG_LLM_MODEL: ${{ vars.RAG_LLM_MODEL || 'gemini-3.8-flash' }}
      RAG_EMBED_MODEL: gemini-embedding-001
      RAG_CHROMA_PATH: chroma-gemini
      RAG_EVAL_PAUSE: "4" # free tier: a few requests per minute
    steps:
      - name: Check the API key
        id: key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::Add the GEMINI_API_KEY repository secret to run the Gemini evaluation."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pasted secrets often carry quotes, spaces or a newline: clean them (never printing the key).
          clean=$(printf '%s' "$OPENAI_API_KEY" | tr -d "\"' \r\n\t")
          echo "::add-mask::$clean"
          if [ "$clean" != "$OPENAI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY had quotes, spaces or line breaks around it; they were removed."
          fi
          echo "Key length: ${#clean} characters"
          echo "OPENAI_API_KEY=$clean" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-python@v6
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.key.outputs.ok == 'true'
        run: pip install --quiet -r requirements.txt

      - name: Models this key can use
        if: steps.key.outputs.ok == 'true'
        run: |
          curl -sS -H "Authorization: Bearer $OPENAI_API_KEY" "${OPENAI_BASE_URL}models" \
            | python -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(sorted(m['id'] for m in d.get('data', []))) or d)"

      - name: Build the index with Gemini embeddings (uses the committed cache when present)
        if: steps.key.outputs.ok == 'true'
        run: |
          python populate_database.py --no-download
          python -m rag.embedding_cache

      - name: Save the embedding cache right away (so a later failure doesn't spend the quota again)
        if: steps.key.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/embeddings-gemini-embedding-001.npz
          if ! git diff --cached --quiet; then
            git commit -qm "Gemini embedding cache"
            git pull -q --rebase origin main
            git push origin HEAD:main
          fi

      - name: Calibrate the relevance gate for Gemini embeddings
        if: steps.key.outputs.ok == 'true'
        run: |
          set -o pipefail
          threshold=$(RAG_EVAL_PAUSE=1 python -m eval.run_eval --suggest-threshold | tail -1)
          [[ "$threshold" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::Calibration did not print a number: $threshold"; exit 1; }
          echo "Calibrated RAG_MIN_RELEVANCE: $threshold" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "RAG_MIN_RELEVANCE=$threshold" >> "$GITHUB_ENV"

      - name: Evaluation (35 questions, hybrid vs vector)
        if: steps.key.outputs.ok == 'true'
        run: |
          python -m eval.run_eval --out eval/results-gemini.md
          cat eval/results-gemini.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record the demo
        if: steps.key.outputs.ok == 'true'
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium > /dev/null
          sudo apt-get install -y -qq ffmpeg > /dev/null
          nohup streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          if ! python .github/scripts/record_gif.py http://localhost:8501; then cat streamlit.log; exit 1; fi
          trim=$(cat trim.txt)
          filters="fps=12,scale=960:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle"
          ffmpeg -loglevel error -y -ss "$trim" -i demo.webm -vf "$filters" -loop 0 demo.gif
          if [ "$(stat -c %s demo.gif)" -gt 9000000 ]; then
            ffmpeg -loglevel error -y -ss "$trim" -i demo.webm -vf "${filters/fps=12,scale=960/fps=10,scale=800}" -loop 0 demo.gif
          fi
          ls -la demo.gif

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.ok == 'true'
        with:
          name: gemini
          path: |
            eval/results-gemini.md
            data/embeddings-gemini-embedding-001.npz
            demo.gif
            demo.webm
            streamlit.log

      - name: Publish results (main) and GIF (demo-media branch)
        if: steps.key.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results-gemini.md data/embeddings-gemini-embedding-001.npz
          if ! git diff --cached --quiet; then
            git commit -qm "Gemini evaluation results and embedding cache (online demo setup)"
            git pull -q --rebase origin main
            git push origin HEAD:main
          fi
          # The GIF lives on its own branch (force-pushed) so the history of main doesn't grow.
          cp demo.gif /tmp/demo.gif
          git checkout -q --orphan demo-media
          git rm -rq --cached .
          cp /tmp/demo.gif demo.gif
          git add demo.gif
          git commit -qm "Demo GIF for ${GITHUB_SHA::7}"
          git push -f origin HEAD:demo-media
